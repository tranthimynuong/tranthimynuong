<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Tran Thi My Nuong — Software Engineer</title>
  <desc id="desc">A dark blue portfolio banner for a software engineer and QA automation specialist.</desc>

  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1736" />
      <stop offset="55%" stop-color="#123A78" />
      <stop offset="100%" stop-color="#087F8C" />
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.32" />
    </filter>
  </defs>

  <rect width="1200" height="220" rx="24" fill="url(#background)" />
  <rect width="1200" height="220" rx="24" fill="url(#glow)" />
  <path d="M0 190 C210 150 330 220 535 180 S885 125 1200 170 V220 H0 Z" fill="#020617" opacity="0.18" />

  <g fill="none" stroke="#BAE6FD" stroke-opacity="0.16">
    <circle cx="1030" cy="50" r="96" stroke-width="1.5" />
    <circle cx="1030" cy="50" r="70" stroke-width="1" />
    <path d="M920 0 L1200 180 M1010 0 L1200 120" />
  </g>

  <g fill="#E0F2FE">
    <circle cx="90" cy="54" r="2" opacity="0.75" />
    <circle cx="1100" cy="42" r="2.5" opacity="0.8" />
    <circle cx="1138" cy="100" r="1.5" opacity="0.6" />
  </g>

  <g transform="translate(92 58)" filter="url(#shadow)">
    <rect width="238" height="30" rx="15" fill="#0F766E" opacity="0.95" />
    <circle cx="18" cy="15" r="5" fill="url(#accent)" />
    <text x="34" y="20" fill="#ECFEFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">SOFTWARE ENGINEER</text>

    <text x="0" y="78" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" letter-spacing="-1.4">Hi, I'm My Nuong</text>
    <rect x="0" y="96" width="116" height="4" rx="2" fill="url(#accent)" />
    <text x="0" y="132" fill="#D7F9FF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" letter-spacing="0.35">QA &amp; test automation · Full-stack development</text>
  </g>

  <g transform="translate(1036 138)">
    <circle r="34" fill="#0F172A" fill-opacity="0.34" stroke="#A7F3D0" stroke-opacity="0.55" />
    <path d="M-13 0 H13 M0 -13 V13" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" />
    <circle r="5" fill="#67E8F9" />
