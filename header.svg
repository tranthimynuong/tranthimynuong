<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200" preserveAspectRatio="none">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4">
        <animate attributeName="stop-color" values="#0052D4;#4364F7;#6FB1FC;#0052D4" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#4364F7">
        <animate attributeName="stop-color" values="#4364F7;#6FB1FC;#0052D4;#4364F7" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#6FB1FC">
        <animate attributeName="stop-color" values="#6FB1FC;#0052D4;#4364F7;#6FB1FC" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="waveGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00CEC9" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      font-weight: 500;
      fill: #e0f2fe;
      letter-spacing: 0.5px;
    }
    .wave-bg {
      fill: url(#waveGrad);
    }
    .wave-glow {
      fill: url(#waveGlow);
    }
  </style>

  <!-- Background Wave Shape -->
  <path class="wave-bg" d="M0,0 L900,0 L900,145 C750,185 600,125 450,155 C300,185 150,135 0,165 Z" />
  <path class="wave-glow" d="M0,0 L900,0 L900,135 C700,170 550,130 400,160 C250,185 100,140 0,155 Z" opacity="0.4" />

  <!-- Stars & Glow Accent Dots -->
  <circle cx="120" cy="45" r="2" fill="#ffffff" opacity="0.7">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="780" cy="65" r="2.5" fill="#ffffff" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="250" cy="120" r="1.5" fill="#ffffff" opacity="0.5" />
  <circle cx="680" cy="110" r="1.8" fill="#ffffff" opacity="0.6" />

  <!-- Centered Header Texts with Drop Shadow -->
  <g filter="url(#shadow)" text-anchor="middle">
    <text x="450" y="82" class="title">Hi, I'm My Nuong ✨</text>
    <text x="450" y="118" class="subtitle">Software Engineer · QA &amp; Test Automation Specialist</text>
  </g>
</svg>